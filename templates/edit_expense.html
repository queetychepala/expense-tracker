<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense</title>
</head>
<body>
    <h1>Edit Expense</h1>

    <form method="POST">
        <label>Amount (₹):</label><br>
        <input type="number" name="amount" step="0.01"
               value="{{ '%.2f'|format(expense.amount_paise / 100) }}" required><br><br>

        <label>Category:</label><br>
        <select name="category" required>
            {% for c in ["Food", "Travel", "Shopping", "Bills", "Other"] %}
            <option value="{{ c }}" {% if c == expense.category %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
        </select><br><br>

        <label>Date:</label><br>
        <input type="date" name="date" value="{{ expense.date }}" required><br><br>

        <label>Note:</label><br>
        <input type="text" name="note" value="{{ expense.note or '' }}"><br><br>

        <button type="submit">Update Expense</button>
        <a href="{{ url_for('home') }}">Cancel</a>
    </form>
</body>
</html>
